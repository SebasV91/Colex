<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ColeX - Sistema de Catalogación</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
    <!-- Navbar -->
    <header class="bg-blue-900 text-white shadow-md p-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <!-- Logotipo PNG -->
            <img src="img/logo.png" alt="Logo ColeX" class="w-9 h-9 object-contain bg-blue-800 p-1 rounded-lg">
            <h1 class="text-xl font-semibold tracking-wide">ColeX</h1>
        </div>
        <button id="openModalBtn" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg text-sm font-medium transition cursor-pointer shadow-sm">
            + Añadir Obra
        </button>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto p-6">
        <!-- Buscador y Filtros -->
        <div class="mb-6 flex flex-col md:flex-row gap-4 justify-between">
            <input type="text" id="searchInput" placeholder="Buscar por título, autor o editorial..." class="w-full md:w-1/3 p-3 border rounded-lg shadow-sm focus:ring-2 focus:ring-blue-600 outline-none bg-white">
            <select id="filterMaterial" class="p-3 border rounded-lg shadow-sm bg-white focus:ring-2 focus:ring-blue-600 outline-none">
                <option value="">Todos los tipos de material</option>
                <option value="Cómic">Cómic</option>
                <option value="Novela Gráfica">Novela Gráfica</option>
                <option value="Manga">Manga</option>
                <option value="Fanzine">Fanzine</option>
                <option value="Libro">Libro</option>
            </select>
        </div>

        <!-- Contenedor de la Colección (Grid) -->
        <div id="gridColeccion" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            <!-- Las tarjetas se inyectarán dinámicamente con JS -->
        </div>
    </main>

    <!-- Modal para Añadir Obra -->
    <div id="modalAdd" class="fixed inset-0 bg-black/50 hidden flex justify-center items-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-xl max-w-lg w-full p-6 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-slate-900">Añadir Nueva Obra</h2>
                <button id="closeModalBtn" class="text-slate-400 hover:text-slate-600 text-2xl font-bold cursor-pointer">&times;</button>
            </div>

            <form id="formAddObra" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Título de la Obra *</label>
                    <input type="text" id="titulo" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-600 outline-none">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Número / Tomo</label>
                        <input type="text" id="numero" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-600 outline-none" placeholder="Ej. #5">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Año de Lanzamiento</label>
                        <input type="number" id="anio" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-600 outline-none" placeholder="Ej. 2023">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <!-- Tipo de Material Principal -->
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Tipo de Material *</label>
                        <select id="tipoMaterial" required class="w-full p-2.5 border rounded-lg bg-white focus:ring-2 focus:ring-blue-600 outline-none">
                            <option value="">Seleccione...</option>
                            <option value="Cómic">Cómic</option>
                            <option value="Novela Gráfica">Novela Gráfica</option>
                            <option value="Manga">Manga</option>
                            <option value="Fanzine">Fanzine</option>
                            <option value="Libro">Libro</option>
                        </select>
                    </div>
                    <!-- Subtipo / Formato (Dependiente) -->
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Formato *</label>
                        <select id="subtipoMaterial" required disabled class="w-full p-2.5 border rounded-lg bg-slate-100 focus:ring-2 focus:ring-blue-600 outline-none">
                            <option value="">Seleccione tipo primero...</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Autor / Guionista</label>
                        <input type="text" id="autor" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-600 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Dibujante / Ilustrador</label>
                        <input type="text" id="dibujante" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-600 outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Editorial</label>
                        <input type="text" id="editorial" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-600 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Estado Físico</label>
                        <select id="estadoFisico" class="w-full p-2.5 border rounded-lg bg-white focus:ring-2 focus:ring-blue-600 outline-none">
                            <option value="Nuevo">Nuevo</option>
                            <option value="Usado">Usado</option>
                            <option value="Deteriorado">Deteriorado</option>
                            <option value="Excelente">Excelente</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Valor Manual ($)</label>
                        <input type="number" step="0.01" id="valorManual" value="0.00" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-600 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">URL de Portada</label>
                        <input type="url" id="portadaUrl" placeholder="https://..." class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-600 outline-none">
                    </div>
                </div>

                <div class="flex justify-end space-x-3 pt-4 border-t">
                    <button type="button" id="cancelModalBtn" class="px-4 py-2 border rounded-lg text-slate-600 hover:bg-slate-100 transition cursor-pointer">Cancelar</button>
                    <button type="submit" class="px-5 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition font-medium cursor-pointer">Guardar Obra</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script Principal -->
    <script type="module" src="app.js"></script>
</body>
</html>

    <!-- Script Principal -->
    <script type="module" src="app.js"></script>
</body>
</html>
