<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ColeX - Sistema de Catalogación Universal</title>
    
    <!-- Tailwind CSS v2 Estático -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    
    <!-- Supabase UMD Global -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        .library-bg {
            background-image: linear-gradient(rgba(15, 23, 42, 0.92), rgba(30, 20, 10, 0.96)), url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?auto=format&fit=crop&w=1200&q=80');
            background-size: cover;
            background-position: center;
        }
        .colex-container { background-color: #0f172a !important; border: 1px solid rgba(180, 83, 9, 0.5); }
        .colex-card { background-color: #1e293b !important; border: 1px solid #334155 !important; }
        .colex-input { background-color: #1e293b !important; border: 1px solid #475569 !important; color: #f8fafc !important; }
        .colex-input:focus { border-color: #d97706 !important; outline: none; }
        .text-amber-custom { color: #fde68a !important; }
        .bg-amber-btn { background-color: #b45309 !important; }
        .bg-amber-btn:hover { background-color: #d97706 !important; }

        .cx-block-c { background-color: #ea580c !important; color: #ffffff !important; }
        .cx-block-x { background-color: #f97316 !important; color: #ffffff !important; }

        body.public-mode .admin-only { display: none !important; }
    </style>
</head>
<body class="library-bg text-slate-100 min-h-screen flex justify-center items-center p-0 sm:p-4">

    <div class="w-full max-w-md colex-container min-h-screen sm:min-h-[880px] sm:max-h-[920px] sm:rounded-3xl shadow-2xl flex flex-col overflow-hidden relative">
        
        <!-- Marca de Agua de Fondo -->
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-0 select-none overflow-hidden opacity-8">
            <svg class="w-80 h-80 sm:w-96 sm:h-96 text-amber-500" viewBox="0 0 200 220" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M100 15 L180 38 C180 120 145 175 100 205 C55 175 20 120 20 38 Z" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round" stroke-opacity="0.35"/>
                <text x="50" y="122" font-family="system-ui, sans-serif" font-weight="900" font-size="72" fill="currentColor" fill-opacity="0.3">C</text>
                <text x="112" y="122" font-family="system-ui, sans-serif" font-weight="900" font-size="72" fill="#fb923c" fill-opacity="0.3">X</text>
            </svg>
        </div>

        <div class="relative z-10 flex-1 flex flex-col overflow-hidden">

            <!-- ================= PANTALLA 1: MI COLECCIÓN ================= -->
            <section id="viewColeccion" class="app-screen flex-1 flex flex-col p-5 overflow-y-auto">
                <div class="flex justify-between items-center mb-4 pt-2">
                    <div class="flex items-center space-x-3">
                        <div class="flex items-center shadow-lg rounded-xl overflow-hidden border-2 border-amber-600">
                            <span class="cx-block-c font-black text-base px-4 py-2.5 flex items-center justify-center tracking-tighter">C</span>
                            <span class="cx-block-x font-black text-base px-4 py-2.5 flex items-center justify-center tracking-tighter">X</span>
                        </div>
                        <h1 class="text-3xl font-extrabold text-amber-custom tracking-tight">ColeX</h1>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button id="btnVitrinaToggle" class="w-10 h-10 colex-card text-amber-custom hover:bg-amber-700 hover:text-white rounded-full flex items-center justify-center text-base transition cursor-pointer shadow-md" title="Alternar Modo Vitrina / Público">👁️</button>
                        <button id="btnIrFormTop" class="w-10 h-10 colex-card text-amber-custom hover:bg-amber-700 hover:text-white rounded-full flex items-center justify-center text-3xl font-light transition cursor-pointer shadow-md admin-only">+</button>
                    </div>
                </div>

                <div class="mb-4 space-y-2">
                    <input type="text" id="searchInput" placeholder="🔍 Buscar por título, autor, notas..." class="w-full p-3 colex-input rounded-xl text-sm placeholder-gray-400 transition">
                    <div class="flex items-center justify-between">
                        <span class="text-[11px] text-amber-custom font-semibold">Ordenar por:</span>
                        <select id="selectOrden" class="p-2 colex-input rounded-xl text-xs">
                            <option value="recientes" class="bg-gray-900">Más recientes (ID)</option>
                            <option value="alfabetico" class="bg-gray-900">Alfabético (A-Z)</option>
                            <option value="precio-desc" class="bg-gray-900">Precio: Mayor a Menor</option>
                            <option value="precio-asc" class="bg-gray-900">Precio: Menor a Mayor</option>
                            <option value="anio" class="bg-gray-900">Año de lanzamiento</option>
                            <option value="estrellas" class="bg-gray-900">Calificación (Estrellas)</option>
                        </select>
                    </div>
                </div>

                <div id="listColeccion" class="space-y-4 flex-1 overflow-y-auto pr-1">
                    <!-- Dinámico -->
                </div>

                <!-- Barra de Navegación Inferior -->
                <div class="pt-3 pb-2 mt-2 border-t border-gray-800 flex justify-around items-center text-amber-custom colex-container rounded-2xl">
                    <button id="navColeccion" class="flex flex-col items-center text-xs hover:text-white transition cursor-pointer p-1">
                        <span class="text-xl">📚</span>
                        <span>Colección</span>
                    </button>
                    <button id="navAgregar" class="flex flex-col items-center text-xs hover:text-white transition cursor-pointer p-1 admin-only">
                        <span class="text-xl">➕</span>
                        <span>Agregar</span>
                    </button>
                    <button id="navStats" class="flex flex-col items-center text-xs hover:text-white transition cursor-pointer p-1">
                        <span class="text-xl">📊</span>
                        <span>Filtros & Stats</span>
                    </button>
                </div>
            </section>

            <!-- ================= PANTALLA 2: DETALLE ================= -->
            <section id="viewDetalle" class="app-screen hidden flex-1 flex flex-col p-5 overflow-y-auto colex-container">
                <button id="btnVolverDetalle" class="text-amber-custom hover:text-white text-2xl mb-4 self-start cursor-pointer font-bold">← Volver</button>
                <div id="detalleContent" class="space-y-4"></div>
            </section>

            <!-- ================= PANTALLA 3: FORMULARIO ================= -->
            <section id="viewForm" class="app-screen hidden flex-1 flex flex-col p-5 overflow-y-auto colex-container">
                <div class="flex items-center mb-6 pt-2">
                    <button id="btnVolverForm" class="text-amber-custom hover:text-white text-2xl mr-4 cursor-pointer font-bold">←</button>
                    <h2 id="formTitle" class="text-xl font-bold text-amber-custom">Agregar Coleccionable</h2>
                </div>

                <form id="formObra" class="space-y-4 flex-1 flex flex-col justify-between pb-4">
                    <input type="hidden" id="editObraId" value="">

                    <div class="space-y-3.5">
                        <div class="flex flex-col p-4 colex-card rounded-2xl border-2 border-dashed border-gray-600 space-y-2.5">
                            <span class="text-xs font-bold text-amber-custom flex items-center justify-between">
                                <span>📷 Foto / Portada</span>
                                <span id="compressBadge" class="hidden text-[10px] text-green-400 font-normal">⚡ Imagen Comprimida</span>
                            </span>
                            <div>
                                <label for="portadaFile" class="flex items-center justify-center gap-2 w-full py-2.5 px-3 colex-card hover:bg-gray-700 rounded-xl text-xs font-semibold text-amber-custom cursor-pointer transition shadow-sm">
                                    📁 Elegir archivo local (jpg, png, webp)
                                </label>
                                <input type="file" id="portadaFile" accept=".jpg, .jpeg, .png, .webp" class="hidden">
                                <span id="fileName" class="block text-[11px] text-gray-400 mt-1 text-center truncate">Sin archivo seleccionado</span>
                            </div>
                            <div class="text-center text-[10px] text-gray-400 font-medium uppercase tracking-wider">- o pega la url de la imagen -</div>
                            <div>
                                <input type="url" id="portadaUrl" placeholder="https://..." class="w-full text-center text-xs p-2.5 colex-input rounded-lg placeholder-gray-500">
                            </div>
                        </div>

                        <div>
                            <label class="text-xs text-gray-400 font-semibold uppercase tracking-wider">Nombre / Título *</label>
                            <input type="text" id="titulo" required class="w-full p-3 colex-input rounded-xl text-sm" placeholder="Ej. The Dark Knight">
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="text-xs text-gray-400 font-semibold uppercase tracking-wider">Número / Set</label>
                                <input type="text" id="numero" class="w-full p-3 colex-input rounded-xl text-sm" placeholder="Ej. #1">
                            </div>
                            <div>
                                <label class="text-xs text-gray-400 font-semibold uppercase tracking-wider">Año</label>
                                <input type="number" id="anio" class="w-full p-3 colex-input rounded-xl text-sm" placeholder="Ej. 2023">
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="text-xs text-gray-400 font-semibold uppercase tracking-wider">Categoría *</label>
                                <select id="tipoMaterial" required class="w-full p-3 colex-input rounded-xl text-sm">
                                    <option value="" class="bg-gray-900">Seleccionar...</option>
                                    <option value="Cómic / Manga / Libro / Fanzine / Revista" class="bg-gray-900">Cómic / Manga / Libro / Fanzine / Revista</option>
                                    <option value="Cartas TCG" class="bg-gray-900">Cartas TCG</option>
                                    <option value="Vehículos a Escala (Hot Wheels)" class="bg-gray-900">Hot Wheels / Vehículos</option>
                                    <option value="Figuras / Funkos / Estatuas" class="bg-gray-900">Figuras / Funkos / Estatuas</option>
                                    <option value="Videojuegos / Retro" class="bg-gray-900">Videojuegos / Retro</option>
                                    <option value="Música (LPs/Vinilos, CDs)" class="bg-gray-900">Música (LPs/Vinilos, CDs)</option>
                                    <option value="Otro" class="bg-gray-900">Otro</option>
                                </select>
                            </div>
                            <div>
                                <label class="text-xs text-gray-400 font-semibold uppercase tracking-wider">Variante / Formato *</label>
                                <div id="subtipoContainer">
                                    <select id="subtipoMaterial" required class="w-full p-3 colex-input rounded-xl text-sm">
                                        <option value="" class="bg-gray-900">Selecciona categoría...</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div id="leidoContainer" class="hidden flex items-center space-x-3 p-3 colex-card rounded-xl border border-amber-600/40">
                            <input type="checkbox" id="chkLeido" class="w-5 h-5 text-amber-600 bg-gray-900 border-gray-600 rounded cursor-pointer">
                            <label for="chkLeido" class="text-xs font-semibold text-amber-custom cursor-pointer select-none flex-1">
                                📖 ¿Leído / Completado?
                            </label>
                        </div>

                        <div>
                            <label class="text-xs text-amber-custom font-semibold uppercase tracking-wider">Calificación Personal (★)</label>
                            <select id="estrellas" class="w-full p-3 colex-input rounded-xl text-sm">
                                <option value="0" class="bg-gray-900">Sin calificación</option>
                                <option value="1" class="bg-gray-900">★ 1 Estrella</option>
                                <option value="2" class="bg-gray-900">★★ 2 Estrellas</option>
                                <option value="3" class="bg-gray-900">★★★ 3 Estrellas</option>
                                <option value="4" class="bg-gray-900">★★★★ 4 Estrellas</option>
                                <option value="5" class="bg-gray-900">★★★★★ 5 Estrellas (Obra Maestra)</option>
                            </select>
                        </div>

                        <div>
                            <label class="text-xs text-gray-400 font-semibold uppercase tracking-wider">Autor / Artista / Serie</label>
                            <input type="text" id="autor" class="w-full p-3 colex-input rounded-xl text-sm" placeholder="Ej. Stan Lee">
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="text-xs text-gray-400 font-semibold uppercase tracking-wider">Editorial / Fabricante</label>
                                <input type="text" id="editorial" class="w-full p-3 colex-input rounded-xl text-sm" placeholder="Ej. Marvel">
                            </div>
                            <div>
                                <label class="text-xs text-gray-400 font-semibold uppercase tracking-wider">Estado</label>
                                <select id="estadoFisico" class="w-full p-3 colex-input rounded-xl text-sm">
                                    <option value="Nuevo / Mint" class="bg-gray-900">Nuevo / Mint</option>
                                    <option value="Excelente" class="bg-gray-900">Excelente</option>
                                    <option value="Usado / Jugado" class="bg-gray-900">Usado / Jugado</option>
                                    <option value="Deteriorado" class="bg-gray-900">Deteriorado</option>
                                </select>
                            </div>
                        </div>

                        <div>
                            <label class="text-xs text-amber-custom font-semibold uppercase tracking-wider">Precio Aproximado ($)</label>
                            <input type="number" step="0.01" id="valorManual" value="0.00" class="w-full p-3 colex-input rounded-xl text-sm">
                        </div>

                        <div>
                            <label class="text-xs text-gray-400 font-semibold uppercase tracking-wider">Notas / Observaciones</label>
                            <textarea id="notas" rows="2" class="w-full p-3 colex-input rounded-xl text-xs placeholder-gray-500" placeholder="Ej. Ejemplar firmado por el autor..."></textarea>
                        </div>
                    </div>

                    <button type="submit" id="btnSubmitForm" class="w-full py-3.5 bg-amber-btn text-white font-bold rounded-xl transition cursor-pointer mt-4 shadow-md">Guardar Ítem</button>
                </form>
            </section>

            <!-- ================= PANTALLA 4: ESTADÍSTICAS & FILTROS ================= -->
            <section id="viewStats" class="app-screen hidden flex-1 flex flex-col p-5 overflow-y-auto colex-container">
                <div class="flex items-center mb-4 pt-2">
                    <button id="btnVolverStats" class="text-amber-custom hover:text-white text-2xl mr-4 cursor-pointer font-bold">←</button>
                    <h2 class="text-xl font-bold text-amber-custom">Filtros & Estadísticas</h2>
                </div>

                <div class="space-y-3.5 colex-card p-4 rounded-2xl mb-4">
                    <h3 class="font-bold text-xs text-amber-custom uppercase tracking-wider">Filtros de Búsqueda</h3>
                    
                    <div>
                        <label class="text-[11px] text-gray-400 font-semibold">Categoría</label>
                        <select id="filtroTipo" class="w-full p-2.5 colex-input rounded-xl text-xs mt-1">
                            <option value="" class="bg-gray-900">Todas las categorías</option>
                            <option value="Cómic / Manga / Libro / Fanzine / Revista" class="bg-gray-900">Cómic / Manga / Libro / Fanzine / Revista</option>
                            <option value="Cartas TCG" class="bg-gray-900">Cartas TCG</option>
                            <option value="Vehículos a Escala (Hot Wheels)" class="bg-gray-900">Hot Wheels / Vehículos</option>
                            <option value="Figuras / Funkos / Estatuas" class="bg-gray-900">Figuras / Funkos / Estatuas</option>
                            <option value="Videojuegos / Retro" class="bg-gray-900">Videojuegos / Retro</option>
                            <option value="Música (LPs/Vinilos, CDs)" class="bg-gray-900">Música (LPs/Vinilos, CDs)</option>
                            <option value="Otro" class="bg-gray-900">Otro</option>
                        </select>
                    </div>

                    <div>
                        <label class="text-[11px] text-gray-400 font-semibold">Editorial / Fabricante</label>
                        <input type="text" id="filtroEditorial" placeholder="Ej. Marvel..." class="w-full p-2.5 colex-input rounded-xl text-xs placeholder-gray-500 mt-1">
                    </div>

                    <div>
                        <label class="text-[11px] text-gray-400 font-semibold">Precio Máximo ($)</label>
                        <input type="number" id="filtroPrecio" placeholder="Ej. 100" class="w-full p-2.5 colex-input rounded-xl text-xs placeholder-gray-500 mt-1">
                    </div>

                    <button id="btnAplicarFiltros" class="w-full py-2 bg-amber-btn text-white font-semibold rounded-xl text-xs transition cursor-pointer">Aplicar Filtros</button>
                    <button id="btnLimpiarFiltros" class="w-full py-1.5 bg-transparent text-gray-400 font-medium rounded-xl text-xs hover:text-white transition cursor-pointer">Limpiar Filtros</button>
                </div>

                <div class="space-y-3 colex-card p-4 rounded-2xl mb-4">
                    <h3 class="font-bold text-xs text-amber-custom uppercase tracking-wider">Métricas Generales</h3>
                    <div class="flex justify-between text-sm">
                        <span class="text-gray-400">Ítems filtrados/totales:</span>
                        <span id="statTotal" class="font-bold text-gray-200">0</span>
                    </div>
                    <div class="flex justify-between text-sm">
                        <span class="text-gray-400">Valor total estimado:</span>
                        <span id="statValor" class="font-bold text-amber-custom">$0.00</span>
                    </div>
                    <div id="statDesgloseCategorias" class="pt-2 border-t border-gray-700 space-y-1 text-xs"></div>
                </div>

                <div class="space-y-2.5 pt-2">
                    <h3 class="font-bold text-xs text-amber-custom uppercase tracking-wider">Exportar Datos</h3>
                    <div class="grid grid-cols-3 gap-2">
                        <button id="btnExportCSV" class="py-2.5 bg-green-700 text-white font-semibold rounded-xl text-xs hover:bg-green-600 transition cursor-pointer shadow-sm">CSV</button>
                        <button id="btnExportExcel" class="py-2.5 bg-blue-700 text-white font-semibold rounded-xl text-xs hover:bg-blue-600 transition cursor-pointer shadow-sm">Excel</button>
                        <button id="btnExportPDF" class="py-2.5 bg-red-700 text-white font-semibold rounded-xl text-xs hover:bg-red-600 transition cursor-pointer shadow-sm">PDF</button>
                    </div>
                </div>
            </section>

        </div>
    </div>

    <!-- ================= MOTOR JAVASCRIPT INTEGRADO (SIN ARCHIVOS EXTERNOS) ================= -->
    <script>
        const SUPABASE_URL = 'https://ljxhehuierhexvkveszr.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_o_m6elxMjBmViae-LChBfQ_G4BB8LAy';

        let supabase = null;
        try {
            if (window.supabase && SUPABASE_URL && SUPABASE_ANON_KEY) {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch (e) {
            console.error('Error al inicializar Supabase:', e);
        }

        let coleccionData = [];
        let coleccionFiltrada = [];
        let mapaObras = {}; 
        let base64Comprimido = '';
        let modoVitrinaActivo = false;

        const SUBTIPOS_MAP = {
            "Cómic / Manga / Libro / Fanzine / Revista": ["Cómic", "Novela Gráfica", "Manga", "Libro", "Fanzine", "Revista"],
            "Cartas TCG": ["Cartas Sueltas / Singles", "Sobres / Packs", "Cajas / Booster Box", "Decks / Mazos", "Accesorios / Protecciones"],
            "Vehículos a Escala (Hot Wheels)": ["Hot Wheels Mainline", "Hot Wheels Premium", "Matchbox", "Majorette", "Greenlight", "1:64", "1:43", "1:18", "Otro Vehículo"],
            "Figuras / Funkos / Estatuas": ["Funko Pop!", "Figura de Acción", "Estatua / Resin", "Nendoroid", "Scale Figure", "Model Kit / Gunpla"],
            "Videojuegos / Retro": ["Juego Físico", "Consola", "Mando / Mandos", "Edición Coleccionista", "Accesorio"],
            "Música (LPs/Vinilos, CDs)": ["LP / Vinilo", "CD", "Cassette", "Boxset / Edición Especial"]
        };

        function cambiarPantalla(idPantalla) {
            document.querySelectorAll('.app-screen').forEach(screen => screen.classList.add('hidden'));
            const target = document.getElementById(idPantalla);
            if (target) target.classList.remove('hidden');
        }

        function irAColeccion() {
            cambiarPantalla('viewColeccion');
        }

        function irAFormulario(idObra = null) {
            const formTitle = document.getElementById('formTitle');
            const form = document.getElementById('formObra');
            if (form) form.reset();
            base64Comprimido = '';
            
            const editId = document.getElementById('editObraId');
            if (editId) editId.value = '';
            
            const fileName = document.getElementById('fileName');
            if (fileName) fileName.innerText = 'Sin archivo seleccionado';
            
            const compressBadge = document.getElementById('compressBadge');
            if (compressBadge) compressBadge.classList.add('hidden');

            const obra = (idObra !== null && idObra !== undefined) ? mapaObras[idObra] : null;

            if (obra) {
                if (formTitle) formTitle.innerText = 'Editar Coleccionable';
                if (editId) editId.value = obra.id;
                document.getElementById('titulo').value = obra.titulo || '';
                document.getElementById('numero').value = obra.numero || '';
                document.getElementById('anio').value = obra.anio || '';
                document.getElementById('tipoMaterial').value = obra.tipo_material || '';
                
                cambiarTipo(obra.tipo_material || '');
                document.getElementById('subtipoMaterial').value = obra.subtipo_material || '';
                document.getElementById('chkLeido').checked = !!obra.leido;
                document.getElementById('estrellas').value = obra.estrellas || 0;

                document.getElementById('autor').value = obra.autor || '';
                document.getElementById('editorial').value = obra.editorial || '';
                document.getElementById('estadoFisico').value = obra.estado_fisico || 'Nuevo / Mint';
                document.getElementById('valorManual').value = obra.valor_manual || 0.00;
                document.getElementById('portadaUrl').value = obra.portada_url || '';
                document.getElementById('notas').value = obra.notas || '';
            } else {
                if (formTitle) formTitle.innerText = 'Agregar Coleccionable';
                cambiarTipo('');
            }

            cambiarPantalla('viewForm');
        }

        function irAEstadisticas() {
            calcularEstadisticas();
            cambiarPantalla('viewStats');
        }

        function toggleModoVitrina() {
            modoVitrinaActivo = !modoVitrinaActivo;
            const btn = document.getElementById('btnVitrinaToggle');
            
            if (modoVitrinaActivo) {
                document.body.classList.add('public-mode');
                if (btn) btn.innerText = '🔒';
            } else {
                document.body.classList.remove('public-mode');
                if (btn) btn.innerText = '👁️';
            }

            localStorage.setItem('colex_modo_vitrina', modoVitrinaActivo ? 'true' : 'false');
            renderizarColeccion(coleccionFiltrada);
        }

        function inicializarModoVitrina() {
            const guardado = localStorage.getItem('colex_modo_vitrina');
            if (guardado === 'true') {
                modoVitrinaActivo = true;
                document.body.classList.add('public-mode');
                const btn = document.getElementById('btnVitrinaToggle');
                if (btn) btn.innerText = '🔒';
            }
        }

        function cambiarTipo(categoria) {
            const subtipoContainer = document.getElementById('subtipoContainer');
            const leidoContainer = document.getElementById('leidoContainer');
            if (!subtipoContainer) return;

            if (categoria === 'Otro') {
                subtipoContainer.innerHTML = `
                    <input type="text" id="subtipoMaterial" required placeholder="Escribe el formato o variante..." class="w-full p-3 colex-input rounded-xl text-sm">
                `;
            } else {
                subtipoContainer.innerHTML = `
                    <select id="subtipoMaterial" required class="w-full p-3 colex-input rounded-xl text-sm">
                        <option value="" class="bg-gray-900">Selecciona variante...</option>
                    </select>
                `;

                const subtipoSelect = document.getElementById('subtipoMaterial');
                if (categoria && SUBTIPOS_MAP[categoria]) {
                    SUBTIPOS_MAP[categoria].forEach(sub => {
                        const opt = document.createElement('option');
                        opt.value = sub;
                        opt.textContent = sub;
                        opt.className = 'bg-gray-900';
                        subtipoSelect.appendChild(opt);
                    });
                }
            }

            if (leidoContainer) {
                if (categoria === 'Cómic / Manga / Libro / Fanzine / Revista') {
                    leidoContainer.classList.remove('hidden');
                } else {
                    leidoContainer.classList.add('hidden');
                }
            }
        }

        function procesarArchivo(input) {
            const file = input.files[0];
            if (!file) return;

            const fileNameEl = document.getElementById('fileName');
            if (fileNameEl) fileNameEl.innerText = file.name;

            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 600;
                    const scaleSize = MAX_WIDTH / img.width;
                    canvas.width = MAX_WIDTH;
                    canvas.height = img.height * scaleSize;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                    base64Comprimido = canvas.toDataURL('image/jpeg', 0.7);
                    const badge = document.getElementById('compressBadge');
                    if (badge) badge.classList.remove('hidden');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function cargarColeccion() {
            if (!supabase) {
                console.warn('Supabase no está configurado.');
                return;
            }
            try {
                const { data, error } = await supabase
                    .from('obras')
                    .select('*')
                    .order('id', { ascending: false });

                if (error) throw error;

                coleccionData = data || [];
                mapaObras = {};
                coleccionData.forEach(item => { mapaObras[item.id] = item; });

                coleccionFiltrada = [...coleccionData];
                renderizarColeccion(coleccionFiltrada);
            } catch (err) {
                console.error('Error al cargar la colección:', err.message);
            }
        }

        async function guardarObra(event) {
            if (event) event.preventDefault();
            if (!supabase) {
                alert('Supabase no está configurado.');
                return;
            }

            const id = document.getElementById('editObraId').value;
            const urlDirecta = document.getElementById('portadaUrl').value;
            const portadaFinal = base64Comprimido || urlDirecta || 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=600&q=80';

            const tipoCat = document.getElementById('tipoMaterial').value;
            const esLibro = (tipoCat === 'Cómic / Manga / Libro / Fanzine / Revista');

            const payload = {
                titulo: document.getElementById('titulo').value,
                numero: document.getElementById('numero').value,
                anio: parseInt(document.getElementById('anio').value) || null,
                tipo_material: tipoCat,
                subtipo_material: document.getElementById('subtipoMaterial').value,
                leido: esLibro ? document.getElementById('chkLeido').checked : false,
                estrellas: parseInt(document.getElementById('estrellas').value) || 0,
                autor: document.getElementById('autor').value,
                editorial: document.getElementById('editorial').value,
                estado_fisico: document.getElementById('estadoFisico').value,
                valor_manual: parseFloat(document.getElementById('valorManual').value) || 0.00,
                portada_url: portadaFinal,
                notas: document.getElementById('notas').value
            };

            try {
                if (id) {
                    const { error } = await supabase.from('obras').update(payload).eq('id', id);
                    if (error) throw error;
                } else {
                    const { error } = await supabase.from('obras').insert([payload]);
                    if (error) throw error;
                }

                await cargarColeccion();
                irAColeccion();
            } catch (err) {
                alert('Error al guardar el ítem: ' + err.message);
            }
        }

        async function eliminarObra(id) {
            if (modoVitrinaActivo || !supabase) return;
            if (!confirm('¿Estás seguro de que deseas eliminar este coleccionable?')) return;

            try {
                const { error } = await supabase.from('obras').delete().eq('id', id);
                if (error) throw error;

                await cargarColeccion();
                irAColeccion();
            } catch (err) {
                alert('Error al eliminar: ' + err.message);
            }
        }

        function generarEstrellasHtml(numEstrellas, tamano = 'text-xs') {
            if (!numEstrellas || numEstrellas <= 0) return '';

            let html = `<span class="${tamano} font-bold inline-flex items-center space-x-0.5">`;
            for (let i = 1; i <= 5; i++) {
                if (i <= numEstrellas) {
                    html += `<span style="color: #fbbf24 !important; text-shadow: 0 0 3px rgba(251, 191, 36, 0.4);">★</span>`;
                } else {
                    html += `<span class="opacity-30" style="color: #64748b !important;">★</span>`;
                }
            }
            html += `</span>`;
            return html;
        }

        function renderizarColeccion(lista) {
            const contenedor = document.getElementById('listColeccion');
            if (!contenedor) return;
            contenedor.innerHTML = '';

            if (lista.length === 0) {
                contenedor.innerHTML = `<div class="text-center text-gray-400 py-12 text-sm">No se encontraron coleccionables.</div>`;
                return;
            }

            lista.forEach(item => {
                const esLectura = (item.tipo_material === 'Cómic / Manga / Libro / Fanzine / Revista');
                const estrellasHtml = generarEstrellasHtml(item.estrellas, 'text-xs');

                const card = document.createElement('div');
                card.className = 'colex-card p-3 rounded-2xl flex items-center justify-between gap-3 shadow-md hover:border-amber-600 transition cursor-pointer relative';
                card.addEventListener('click', () => verDetalle(item.id));

                card.innerHTML = `
                    <div class="flex items-center space-x-3 overflow-hidden">
                        <img src="${item.portada_url}" class="w-16 h-20 object-cover rounded-xl border border-gray-700 flex-shrink-0" alt="Portada">
                        <div class="overflow-hidden space-y-1">
                            <h3 class="font-bold text-sm text-gray-100 truncate">${item.titulo}</h3>
                            <p class="text-xs text-amber-custom truncate">${item.autor || 'Sin Autor'} ${item.numero ? `(${item.numero})` : ''}</p>
                            <div class="flex items-center space-x-2">
                                <span class="bg-gray-800 text-gray-300 px-2 py-0.5 rounded-md text-[10px] font-semibold">${item.subtipo_material || item.tipo_material}</span>
                                ${esLectura ? (item.leido ? `<span class="text-xs" title="Leído">📖 ✅</span>` : `<span class="text-xs opacity-50" title="Pendiente">📖 ⏳</span>`) : ''}
                                ${estrellasHtml}
                            </div>
                        </div>
                    </div>
                    <div class="text-right flex-shrink-0">
                        <span class="block font-bold text-amber-custom text-sm">$${(item.valor_manual || 0).toFixed(2)}</span>
                        <span class="text-[10px] text-gray-400 block">${item.anio || ''}</span>
                    </div>
                `;
                contenedor.appendChild(card);
            });
        }

        function verDetalle(id) {
            const item = mapaObras[id];
            const contenedor = document.getElementById('detalleContent');
            if (!contenedor || !item) return;
            
            const esLectura = (item.tipo_material === 'Cómic / Manga / Libro / Fanzine / Revista');
            const numEstrellas = item.estrellas || 0;
            
            const estrellasHtml = numEstrellas > 0 
                ? `<div class="flex items-center justify-center gap-1 mt-1">
                    ${generarEstrellasHtml(numEstrellas, 'text-lg')}
                    <span class="text-xs text-gray-400 font-normal ml-1">(${numEstrellas}/5)</span>
                   </div>`
                : '<span class="text-xs text-gray-500">Sin calificar</span>';

            contenedor.innerHTML = `
                <div class="flex flex-col items-center space-y-3">
                    <img src="${item.portada_url}" class="w-48 h-64 object-cover rounded-2xl shadow-2xl border-2 border-amber-600/50">
                    <h2 class="text-2xl font-black text-amber-custom text-center leading-tight">${item.titulo}</h2>
                    ${estrellasHtml}
                </div>

                <div class="colex-card p-4 rounded-2xl space-y-2.5 text-xs">
                    <div class="flex justify-between border-b border-gray-700 pb-1.5">
                        <span class="text-gray-400 font-semibold">Categoría:</span>
                        <span class="text-gray-200 font-bold">${item.tipo_material}</span>
                    </div>
                    <div class="flex justify-between border-b border-gray-700 pb-1.5">
                        <span class="text-gray-400 font-semibold">Variante / Subtipo:</span>
                        <span class="text-gray-200 font-bold">${item.subtipo_material || 'N/A'}</span>
                    </div>
                    ${esLectura ? `
                    <div class="flex justify-between border-b border-gray-700 pb-1.5">
                        <span class="text-gray-400 font-semibold">Estado de Lectura:</span>
                        <span class="font-bold ${item.leido ? 'text-green-400' : 'text-amber-400'}">${item.leido ? '📖 Leído / Completado' : '⏳ Pendiente'}</span>
                    </div>
                    ` : ''}
                    <div class="flex justify-between border-b border-gray-700 pb-1.5">
                        <span class="text-gray-400 font-semibold">Número / Set:</span>
                        <span class="text-gray-200">${item.numero || 'N/A'}</span>
                    </div>
                    <div class="flex justify-between border-b border-gray-700 pb-1.5">
                        <span class="text-gray-400 font-semibold">Año:</span>
                        <span class="text-gray-200">${item.anio || 'N/A'}</span>
                    </div>
                    <div class="flex justify-between border-b border-gray-700 pb-1.5">
                        <span class="text-gray-400 font-semibold">Autor / Artista:</span>
                        <span class="text-gray-200">${item.autor || 'N/A'}</span>
                    </div>
                    <div class="flex justify-between border-b border-gray-700 pb-1.5">
                        <span class="text-gray-400 font-semibold">Editorial / Fabricante:</span>
                        <span class="text-gray-200">${item.editorial || 'N/A'}</span>
                    </div>
                    <div class="flex justify-between border-b border-gray-700 pb-1.5">
                        <span class="text-gray-400 font-semibold">Estado Físico:</span>
                        <span class="text-gray-200">${item.estado_fisico || 'N/A'}</span>
                    </div>
                    <div class="flex justify-between border-b border-gray-700 pb-1.5">
                        <span class="text-gray-400 font-semibold">Precio Estimado:</span>
                        <span class="text-amber-custom font-bold text-sm">$${(item.valor_manual || 0).toFixed(2)}</span>
                    </div>
                    ${item.notas ? `
                    <div class="pt-1">
                        <span class="text-gray-400 font-semibold block mb-1">Notas / Observaciones:</span>
                        <p class="text-gray-300 italic bg-gray-900/60 p-2.5 rounded-xl border border-gray-800">${item.notas}</p>
                    </div>
                    ` : ''}
                </div>

                <div class="flex space-x-3 pt-2 admin-only">
                    <button id="btnEditarObra" class="flex-1 py-3 bg-blue-700 hover:bg-blue-600 text-white font-bold rounded-xl transition cursor-pointer">Editar</button>
                    <button id="btnEliminarObra" class="flex-1 py-3 bg-red-700 hover:bg-red-600 text-white font-bold rounded-xl transition cursor-pointer">Eliminar</button>
                </div>
            `;

            document.getElementById('btnEditarObra').addEventListener('click', () => irAFormulario(item.id));
            document.getElementById('btnEliminarObra').addEventListener('click', () => eliminarObra(item.id));

            cambiarPantalla('viewDetalle');
        }

        function buscar(query) {
            const q = query.toLowerCase().trim();
            coleccionFiltrada = coleccionData.filter(item => 
                (item.titulo && item.titulo.toLowerCase().includes(q)) ||
                (item.autor && item.autor.toLowerCase().includes(q)) ||
                (item.editorial && item.editorial.toLowerCase().includes(q)) ||
                (item.subtipo_material && item.subtipo_material.toLowerCase().includes(q)) ||
                (item.notas && item.notas.toLowerCase().includes(q))
            );
            renderizarColeccion(coleccionFiltrada);
        }

        function ordenarColeccion(criterio) {
            if (criterio === 'recientes') {
                coleccionFiltrada.sort((a, b) => b.id - a.id);
            } else if (criterio === 'alfabetico') {
                coleccionFiltrada.sort((a, b) => a.titulo.localeCompare(b.titulo));
            } else if (criterio === 'precio-desc') {
                coleccionFiltrada.sort((a, b) => (b.valor_manual || 0) - (a.valor_manual || 0));
            } else if (criterio === 'precio-asc') {
                coleccionFiltrada.sort((a, b) => (a.valor_manual || 0) - (b.valor_manual || 0));
            } else if (criterio === 'anio') {
                coleccionFiltrada.sort((a, b) => (b.anio || 0) - (a.anio || 0));
            } else if (criterio === 'estrellas') {
                coleccionFiltrada.sort((a, b) => (b.estrellas || 0) - (a.estrellas || 0));
            }
            renderizarColeccion(coleccionFiltrada);
        }

        function aplicarFiltros() {
            const tipo = document.getElementById('filtroTipo').value;
            const editorial = document.getElementById('filtroEditorial').value.toLowerCase().trim();
            const precioMax = parseFloat(document.getElementById('filtroPrecio').value);

            coleccionFiltrada = coleccionData.filter(item => {
                let cumple = true;
                if (tipo && item.tipo_material !== tipo) cumple = false;
                if (editorial && (!item.editorial || !item.editorial.toLowerCase().includes(editorial))) cumple = false;
                if (!isNaN(precioMax) && (item.valor_manual || 0) > precioMax) cumple = false;
                return cumple;
            });

            renderizarColeccion(coleccionFiltrada);
            irAColeccion();
        }

        function limpiarFiltros() {
            document.getElementById('filtroTipo').value = '';
            document.getElementById('filtroEditorial').value = '';
            document.getElementById('filtroPrecio').value = '';
            coleccionFiltrada = [...coleccionData];
            renderizarColeccion(coleccionFiltrada);
            irAColeccion();
        }

        function calcularEstadisticas() {
            const totalItems = coleccionFiltrada.length;
            const valorTotal = coleccionFiltrada.reduce((acc, curr) => acc + (curr.valor_manual || 0), 0);

            const statTotal = document.getElementById('statTotal');
            const statValor = document.getElementById('statValor');
            if (statTotal) statTotal.innerText = `${totalItems} / ${coleccionData.length}`;
            if (statValor) statValor.innerText = `$${valorTotal.toFixed(2)}`;

            const desgloses = {};
            coleccionFiltrada.forEach(item => {
                const cat = item.tipo_material || 'Sin Categoría';
                desgloses[cat] = (desgloses[cat] || 0) + 1;
            });

            const contenedor = document.getElementById('statDesgloseCategorias');
            if (!contenedor) return;
            contenedor.innerHTML = '<span class="text-amber-custom font-semibold block mb-1">Desglose por categoría:</span>';

            Object.keys(desgloses).forEach(cat => {
                const row = document.createElement('div');
                row.className = 'flex justify-between text-gray-300';
                row.innerHTML = `<span>${cat}:</span><span class="font-bold">${desgloses[cat]}</span>`;
                contenedor.appendChild(row);
            });
        }

        function exportarCSV() {
            if (coleccionFiltrada.length === 0) return alert('No hay datos para exportar.');
            let csv = 'ID,Título,Número,Año,Categoría,Subtipo,Calificación,Autor,Editorial,Estado,Precio,Notas\n';
            coleccionFiltrada.forEach(i => {
                csv += `"${i.id}","${i.titulo}","${i.numero||''}","${i.anio||''}","${i.tipo_material}","${i.subtipo_material||''}","${i.estrellas||0}","${i.autor||''}","${i.editorial||''}","${i.estado_fisico||''}","${i.valor_manual||0}","${(i.notas||'').replace(/"/g, '""')}"\n`;
            });
            descargarArchivo(csv, 'coleccion_colex.csv', 'text/csv');
        }

        function exportarExcel() {
            exportarCSV();
        }

        function exportarPDF() {
            window.print();
        }

        function descargarArchivo(contenido, nombre, tipo) {
            const blob = new Blob([contenido], { type: tipo });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = nombre;
            a.click();
            URL.revokeObjectURL(url);
        }

        // Enlace programático total en el DOM (Cero fallos de onclick)
        document.addEventListener('DOMContentLoaded', () => {
            inicializarModoVitrina();
            cargarColeccion();

            document.getElementById('btnVitrinaToggle').addEventListener('click', toggleModoVitrina);
            document.getElementById('btnIrFormTop').addEventListener('click', () => irAFormulario());
            document.getElementById('navColeccion').addEventListener('click', irAColeccion);
            document.getElementById('navAgregar').addEventListener('click', () => irAFormulario());
            document.getElementById('navStats').addEventListener('click', irAEstadisticas);
            
            document.getElementById('btnVolverDetalle').addEventListener('click', irAColeccion);
            document.getElementById('btnVolverForm').addEventListener('click', irAColeccion);
            document.getElementById('btnVolverStats').addEventListener('click', irAColeccion);

            document.getElementById('formObra').addEventListener('submit', guardarObra);
            document.getElementById('btnAplicarFiltros').addEventListener('click', aplicarFiltros);
            document.getElementById('btnLimpiarFiltros').addEventListener('click', limpiarFiltros);

            document.getElementById('btnExportCSV').addEventListener('click', exportarCSV);
            document.getElementById('btnExportExcel').addEventListener('click', exportarExcel);
            document.getElementById('btnExportPDF').addEventListener('click', exportarPDF);

            document.getElementById('searchInput').addEventListener('input', (e) => buscar(e.target.value));
            document.getElementById('selectOrden').addEventListener('change', (e) => ordenarColeccion(e.target.value));
            document.getElementById('tipoMaterial').addEventListener('change', (e) => cambiarTipo(e.target.value));

            const fileInput = document.getElementById('portadaFile');
            if (fileInput) {
                fileInput.addEventListener('change', function() { procesarArchivo(this); });
            }
        });
    </script>
</body>
