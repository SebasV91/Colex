<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ColeX - Sistema de Catalogación Universal</title>
    <!-- Carga directa de estilos CSS de Tailwind (Evita bloqueos de JS/AdBlock en escritorio) -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Estilos personalizados para el fondo de biblioteca antigua -->
    <style>
        .library-bg {
            background-image: linear-gradient(rgba(15, 23, 42, 0.85), rgba(30, 20, 10, 0.9)), url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?auto=format&fit=crop&w=1200&q=80');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body class="library-bg text-slate-100 min-h-screen flex justify-center items-center p-0 sm:p-4">

    <!-- Contenedor Principal -->
    <div class="w-full max-w-md bg-slate-900/90 backdrop-blur-md min-h-screen sm:min-h-[850px] sm:max-h-[880px] sm:rounded-3xl shadow-2xl flex flex-col overflow-hidden relative border border-amber-900/40">
        
        <!-- ================= PANTALLA 1: MI COLECCIÓN ================= -->
        <section id="viewColeccion" class="app-screen flex-1 flex flex-col p-5 overflow-y-auto">
            <!-- Header con Logo Estilizado CX -->
            <div class="flex justify-between items-center mb-4 pt-2">
                <div class="flex items-center space-x-2.5">
                    <div class="flex items-center shadow-sm rounded-xl overflow-hidden border border-amber-600/50">
                        <div class="bg-amber-700 text-white font-black text-xs px-2.5 py-1.5 flex items-center justify-center tracking-tighter">C</div>
                        <div class="bg-amber-600 text-white font-black text-xs px-2.5 py-1.5 flex items-center justify-center tracking-tighter">X</div>
                    </div>
                    <h1 class="text-2xl font-bold text-amber-100 tracking-tight">ColeX</h1>
                </div>
                <button id="navToAddBtn" class="w-9 h-9 bg-slate-800 hover:bg-amber-700/50 text-amber-200 hover:text-white rounded-full flex items-center justify-center text-2xl font-light transition cursor-pointer shadow-sm border border-amber-900/50">+</button>
            </div>

            <!-- Buscador -->
            <div class="mb-4">
                <input type="text" id="searchInput" placeholder="🔍 Buscar por título, autor, marca..." class="w-full p-3 bg-slate-800/80 text-slate-200 placeholder-slate-400 rounded-xl text-sm outline-none focus:ring-2 focus:ring-amber-600 border border-slate-700 transition">
            </div>

            <!-- Lista de la Colección (Agrupada por Editorial / Fabricante / Marca) -->
            <div id="listColeccion" class="space-y-4 flex-1 overflow-y-auto pr-1">
                <!-- Se inyecta dinámicamente con JS -->
            </div>

            <!-- Navegación Inferior -->
            <div class="pt-3 pb-2 mt-2 border-t border-slate-800 flex justify-around items-center text-slate-400 bg-slate-900/90">
                <button id="navToAddBtnBottom" class="text-2xl font-bold hover:text-amber-400 transition cursor-pointer p-2">+</button>
                <button id="navToStatsBtn" class="text-xl hover:text-amber-400 transition cursor-pointer p-2" title="Filtros y Estadísticas">🔍</button>
            </div>
        </section>

        <!-- ================= PANTALLA 2: DETALLE DE LA OBRA ================= -->
        <section id="viewDetalle" class="app-screen hidden flex-1 flex flex-col p-5 overflow-y-auto bg-slate-900">
            <button id="backFromDetalle" class="text-amber-200 hover:text-white text-2xl mb-4 self-start cursor-pointer font-bold">←</button>
            <div id="detalleContent" class="space-y-4">
                <!-- Se inyecta dinámicamente con JS -->
            </div>
        </section>

        <!-- ================= PANTALLA 3: AGREGAR / EDITAR ÍTEM ================= -->
        <section id="viewForm" class="app-screen hidden flex-1 flex flex-col p-5 overflow-y-auto bg-slate-900">
            <div class="flex items-center mb-6 pt-2">
                <button id="backFromForm" class="text-amber-200 hover:text-white text-2xl mr-4 cursor-pointer font-bold">←</button>
                <h2 id="formTitle" class="text-xl font-bold text-amber-100">Agregar Coleccionable</h2>
            </div>

            <form id="formObra" class="space-y-4 flex-1 flex flex-col justify-between pb-4">
                <input type="hidden" id="editObraId" value="">

                <div class="space-y-3.5">
                    <!-- Cuadro de Portada / Foto Dual con Compresión -->
                    <div class="flex flex-col p-4 bg-slate-800/60 rounded-2xl border-2 border-dashed border-slate-700 space-y-2.5">
                        <span class="text-xs font-bold text-amber-200 flex items-center justify-between">
                            <span>📷 Foto / Portada</span>
                            <span id="compressBadge" class="hidden text-[10px] text-emerald-400 font-normal">⚡ Imagen Comprimida</span>
                        </span>
                        <div>
                            <label for="portadaFile" class="flex items-center justify-center gap-2 w-full py-2.5 px-3 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl text-xs font-semibold text-amber-400 cursor-pointer transition shadow-sm">
                                📁 Elegir archivo local (jpg, png, webp)
                            </label>
                            <input type="file" id="portadaFile" accept=".jpg, .jpeg, .png, .webp" class="hidden">
                            <span id="fileName" class="block text-[11px] text-slate-400 mt-1 text-center truncate">Sin archivo seleccionado</span>
                        </div>
                        <div class="text-center text-[10px] text-slate-500 font-medium uppercase tracking-wider">- o pega la url de la imagen -</div>
                        <div>
                            <input type="url" id="portadaUrl" placeholder="pega la url de la imagen" class="w-full text-center text-xs p-2.5 bg-slate-800 text-slate-200 placeholder-slate-500 rounded-lg border border-slate-700 outline

    <!-- Script Principal -->
    <script type="module" src="app.js"></script>
</body>
</html>
