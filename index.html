<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ColeX - Catalogación</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex justify-center items-center p-0 sm:p-4">

    <!-- App Container Móvil/Desktop Centrado -->
    <div class="w-full max-w-md bg-white min-h-screen sm:min-h-[840px] sm:max-h-[850px] sm:rounded-3xl shadow-2xl flex flex-col overflow-hidden relative border border-slate-200">
        
        <!-- PANTALLA 1: MI COLECCIÓN -->
        <section id="viewColeccion" class="app-screen flex-1 flex flex-col p-5 overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center space-x-2">
                    <!-- Nuevo Logo -->
                    <img src="img/logo.png" alt="Logo ColeX" class="w-10 h-10 object-contain rounded-lg">
                    <h1 class="text-2xl font-bold text-slate-900">ColeX</h1>
                </div>
                <button id="navToAddBtn" class="text-slate-700 hover:text-blue-600 text-3xl font-light leading-none cursor-pointer">+</button>
            </div>

            <!-- Buscador -->
            <div class="mb-4">
                <input type="text" id="searchInput" placeholder="🔍 Buscar" class="w-full p-3 bg-slate-100 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- Lista de la Colección -->
            <div id="listColeccion" class="space-y-3 flex-1 overflow-y-auto pr-1">
                <!-- Se cargan dinámicamente -->
            </div>

            <!-- Navegación Inferior -->
            <div class="pt-3 border-t flex justify-around items-center text-slate-500">
                <button id="navToAddBtnBottom" class="text-2xl font-bold hover:text-blue-600 cursor-pointer">+</button>
                <button id="navToStatsBtn" class="text-xl hover:text-blue-600 cursor-pointer">🔍</button>
            </div>
        </section>

        <!-- PANTALLA 2: DETALLE DE LA OBRA -->
        <section id="viewDetalle" class="app-screen hidden flex-1 flex flex-col p-5 overflow-y-auto bg-slate-50">
            <button id="backFromDetalle" class="text-slate-700 text-2xl mb-4 self-start cursor-pointer">←</button>
            
            <div id="detalleContent" class="space-y-4">
                <!-- Se inyecta dinámicamente -->
            </div>
        </section>

        <!-- PANTALLA 3: AGREGAR / EDITAR CÓMIC -->
        <section id="viewForm" class="app-screen hidden flex-1 flex flex-col p-5 overflow-y-auto">
            <div class="flex items-center mb-6">
                <button id="backFromForm" class="text-slate-700 text-2xl mr-4 cursor-pointer">←</button>
                <h2 id="formTitle" class="text-xl font-bold text-slate-900">Agregar Cómic</h2>
            </div>

            <form id="formObra" class="space-y-4 flex-1 flex flex-col justify-between">
                <div class="space-y-3">
                    <!-- Cuadro de Portada -->
                    <div class="flex flex-col items-center justify-center p-6 bg-slate-100 rounded-2xl border-2 border-dashed border-slate-300">
                        <span class="text-3xl mb-1">📷</span>
                        <input type="url" id="portadaUrl" placeholder="URL de la Portada" class="w-full text-center text-xs p-2 bg-white rounded-lg border outline-none">
                    </div>

                    <div>
                        <label class="text-xs text-slate-500 font-medium">Título</label>
                        <input type="text" id="titulo" required class="w-full p-3 bg-slate-100 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-xs text-slate-500 font-medium">Número</label>
                            <input type="text" id="numero" class="w-full p-3 bg-slate-100 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="text-xs text-slate-500 font-medium">Año</label>
                            <input type="number" id="anio" class="w-full p-3 bg-slate-100 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-xs text-slate-500 font-medium">Tipo</label>
                            <select id="tipoMaterial" required class="w-full p-3 bg-slate-100 rounded-xl text-sm outline-none">
                                <option value="">Seleccionar...</option>
                                <option value="Cómic">Cómic</option>
                                <option value="Novela Gráfica">Novela Gráfica</option>
                                <option value="Manga">Manga</option>
                                <option value="Fanzine">Fanzine</option>
                                <option value="Libro">Libro</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-xs text-slate-500 font-medium">Formato</label>
                            <select id="subtipoMaterial" required disabled class="w-full p-3 bg-slate-100 rounded-xl text-sm outline-none">
                                <option value="">Esperando tipo...</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="text-xs text-slate-500 font-medium">Autor</label>
                        <input type="text" id="autor" class="w-full p-3 bg-slate-100 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-xs text-slate-500 font-medium">Editorial</label>
                            <input type="text" id="editorial" class="w-full p-3 bg-slate-100 rounded-xl text-sm outline-none">
                        </div>
                        <div>
                            <label class="text-xs text-slate-500 font-medium">Estado</label>
                            <select id="estadoFisico" class="w-full p-3 bg-slate-100 rounded-xl text-sm outline-none">
                                <option value="Nuevo">Nuevo</option>
                                <option value="Usado">Usado</option>
                                <option value="Deteriorado">Deteriorado</option>
                                <option value="Excelente">Excelente</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="text-xs text-slate-500 font-medium">Precio ($)</label>
                        <input type="number" step="0.01" id="valorManual" value="0.00" class="w-full p-3 bg-slate-100 rounded-xl text-sm outline-none">
                    </div>
                </div>

                <button type="submit" class="w-full py-3.5 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 transition cursor-pointer mt-4">Guardar</button>
            </form>
        </section>

        <!-- PANTALLA 4: FILTROS Y ESTADÍSTICAS -->
        <section id="viewStats" class="app-screen hidden flex-1 flex flex-col p-5 overflow-y-auto">
            <div class="flex items-center mb-4">
                <button id="backFromStats" class="text-slate-700 text-2xl mr-4 cursor-pointer">←</button>
                <h2 class="text-xl font-bold text-slate-900">Filtros & Estadísticas</h2>
            </div>

            <!-- Píldoras de Filtro -->
            <div class="flex flex-wrap gap-2 mb-6">
                <button class="filter-pill px-4 py-1.5 border border-blue-600 text-blue-600 rounded-full text-xs font-medium" data-filter="anio">Año</button>
                <button class="filter-pill px-4 py-1.5 border border-blue-600 text-blue-600 rounded-full text-xs font-medium" data-filter="autor">Autor</button>
                <button class="filter-pill px-4 py-1.5 border border-blue-600 text-blue-600 rounded-full text-xs font-medium" data-filter="estado">Estado</button>
                <button class="filter-pill px-4 py-1.5 border border-blue-600 text-blue-600 rounded-full text-xs font-medium" data-filter="editorial">Editorial</button>
            </div>

            <!-- Métricas generales -->
            <div class="space-y-3 bg-slate-50 p-4 rounded-2xl mb-6">
                <h3 class="font-bold text-sm text-slate-800">Estadísticas</h3>
                <div class="flex justify-between text-sm">
                    <span class="text-slate-500">Total de obras:</span>
                    <span id="statTotal" class="font-bold">0</span>
                </div>
                <div class="flex justify-between text-sm">
                    <span class="text-slate-500">Valor estimado:</span>
                    <span id="statValor" class="font-bold text-blue-600">$0.00</span>
                </div>
            </div>
        </section>

    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
