<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ColeX - Sistema de Catalogación Universal</title>
    
    <!-- Tailwind CSS v2 Estático -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    
    <!-- Estilos de la biblioteca antigua, opacidad, colores forzados y modo vitrina -->
    <style>
        .library-bg {
            background-image: linear-gradient(rgba(15, 23, 42, 0.92), rgba(30, 20, 10, 0.96)), url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?auto=format&fit=crop&w=1200&q=80');
            background-size: cover;
            background-position: center;
        }
        .colex-container { background-color: #0f172a !important; border: 1px solid rgba(180, 83, 9, 0.5); }
        .colex-card { background-color: #1e293b !important; border: 1px solid #334155 !important; }
        .colex-input { background-color: #1e293b !important; border: 1px solid #475569 !important; color: #f8fafc !important; }
        .colex-input:focus { border-color: #d97706 !important; outline: none; }
        .text-amber-custom { color: #fde68a !important; }
        .bg-amber-btn { background-color: #b45309 !important; }
        .bg-amber-btn:hover { background-color: #d97706 !important; }

        /* Clases personalizadas forzadas para el Logo CX */
        .cx-block-c { background-color: #ea580c !important; color: #ffffff !important; }
        .cx-block-x { background-color: #f97316 !important; color: #ffffff !important; }

        /* Ocultar elementos de administración en Modo Vitrina Público */
        body.public-mode .admin-only { display: none !important; }
    </style>

    <!-- Stub de Seguridad contra Race Conditions -->
    <script>
        window.ColeXApp = window.ColeXApp || {
            irAFormulario: () => console.log('Cargando sistema...'),
            irAColeccion: () => console.log('Cargando sistema...'),
            irAEstadisticas: () => console.log('Cargando sistema...'),
            guardarObra: (e) => { e.preventDefault(); console.log('Cargando sistema...'); },
            toggleModoVitrina: () => {},
            buscar: () => {},
            ordenarColeccion: () => {},
            cambiarTipo: () => {},
            procesarArchivo: () => {},
            aplicarFiltros: () => {},
            limpiarFiltros: () => {},
            exportarCSV: () => {},
            exportarExcel: () => {},
            exportarPDF: () => {}
        };
    </script>
</head>
<body class="library-bg text-slate-100 min-h-screen flex justify-center items-center p-0 sm:p-4">

    <!-- Contenedor Principal con Escudo Sutil de Fondo -->
    <div class="w-full max-w-md colex-container min-h-screen sm:min-h-[880px] sm:max-h-[920px] sm:rounded-3xl shadow-2xl flex flex-col overflow-hidden relative">
        
        <!-- Marca de Agua de Fondo: Escudo Superhéroe Centrado y Ajustado -->
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-0 select-none overflow-hidden opacity-8">
            <svg class="w-80 h-80 sm:w-96 sm:h-96 text-amber-500" viewBox="0 0 200 220" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M100 15 L180 38 C180 120 145 175 100 205 C55 175 20 120 20 38 Z" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round" stroke-opacity="0.35"/>
                <text x="50" y="122" font-family="system-ui, sans-serif" font-weight="900" font-size="72" fill="currentColor" fill-opacity="0.3">C</text>
                <text x="112" y="122" font-family="system-ui, sans-serif" font-weight="900" font-size="72" fill="#fb923c" fill-opacity="0.3">X</text>
            </svg>
        </div>

        <!-- Contenido Real con z-index superior -->
        <div class="relative z-10 flex-1 flex flex-col overflow-hidden">

            <!-- ================= PANTALLA 1: MI COLECCIÓN ================= -->
            <section id="viewColeccion" class="app-screen flex-1 flex flex-col p-5 overflow-y-auto">
                <!-- Header con Logo CX, Botón Modo Vitrina y Botón Agregar -->
                <div class="flex justify-between items-center mb-4 pt-2">
                    <div class="flex items-center space-x-3">
                        <div class="flex items-center shadow-lg rounded-xl overflow-hidden border-2 border-amber-600">
                            <span class="cx-block-c font-black text-base px-4 py-2.5 flex items-center justify-center tracking-tighter" style="background-color: #ea580c !important; color: #ffffff !important;">C</span>
                            <span class="cx-block-x font-black text-base px-4 py-2.5 flex items-center justify-center tracking-tighter" style="background-color: #f97316 !important; color: #ffffff !important;">X</span>
                        </div>
                        <h1 class="text-3xl font-extrabold text-amber-custom tracking-tight">ColeX</h1>
                    </div>
                    <div class="flex items-center space-x-2">
                        <!-- Botón de Modo Vitrina / Exhibición -->
                        <button onclick="ColeXApp.toggleModoVitrina()" id="btnVitrinaToggle" class="w-10 h-10 colex-card text-amber-custom hover:bg-amber-700 hover:text-white rounded-full flex items-center justify-center text-base transition cursor-pointer shadow-md" title="Alternar Modo Vitrina / Público">👁️</button>
                        <!-- Botón Agregar Ítem -->
                        <button onclick="ColeXApp.irAFormulario()" class="w-10 h-10 colex-card text-amber-custom hover:bg-amber-700 hover:text-white rounded-full flex items-center justify-center text-3xl font-light transition cursor-pointer shadow-md admin-only">+</button>
                    </div>
                </div>

                <!-- Buscador y Selector de Ordenamiento -->
                <div class="mb-4 space-y-2">
                    <input type="text" id="searchInput" oninput="ColeXApp.buscar(this.value)" placeholder="🔍 Buscar por título, autor, marca..." class="w-full p-3 colex-input rounded-xl text-sm placeholder-gray-400 transition">
                    <div class="flex items-center justify-between">
                        <span class="text-[11px] text-amber-custom font-semibold">Ordenar por:</span>
                        <select id="selectOrden" onchange="ColeXApp.ordenarColeccion(this.value)" class="p-2 colex-input rounded-xl text-xs">
                            <option value="recientes" class="bg-gray-900">Más recientes (ID)</option>
                            <option value="alfabetico" class="bg-gray-900">Alfabético (A-Z)</option>
                            <option value="precio-desc" class="bg-gray-900">Precio: Mayor a Menor</option>
                            <option value="precio-asc" class="bg-gray-900">Precio: Menor a Mayor</option>
                            <option value="anio" class="bg-gray-900">Año de lanzamiento</option>
                            <option value="estrellas" class="bg-gray-900">Calificación (Estrellas)</option>
                        </select>
                    </div>
                </div>

                <!-- Lista de la Colección -->
                <div id="listColeccion" class="space-y-4 flex-1 overflow-y-auto pr-1">
                    <!-- Se inyecta dinámicamente con JS -->
                </div>

                <!-- Navegación Inferior -->
                <div class="pt-3 pb-2 mt-2 border-t border-gray-800 flex justify-around items-center text-gray-400 colex-container">
                    <button onclick="ColeXApp.irAFormulario()" class="text-3xl font-bold hover:text-amber-custom transition cursor-pointer p-2 admin-only">+</button>
                    <button onclick="ColeXApp.irAEstadisticas()" class="text-2xl hover:text-amber-custom transition cursor-pointer p-2" title="Filtros y Estadísticas">🔍</button>
                </div>
            </section>

            <!-- ================= PANTALLA 2: DETALLE DE LA OBRA ================= -->
            <section id="viewDetalle" class="app-screen hidden flex-1 flex flex-col p-5 overflow-y-auto colex-container">
                <button onclick="ColeXApp.irAColeccion()" class="text-amber-custom hover:text-white text-2xl mb-4 self-start cursor-pointer font-bold">←</button>
                <div id="detalleContent" class="space-y-4">
                    <!-- Se inyecta dinámicamente con JS -->
                </div>
            </section>

            <!-- ================= PANTALLA 3: AGREGAR / EDITAR ÍTEM ================= -->
            <section id="viewForm" class="app-screen hidden flex-1 flex flex-col p-5 overflow-y-auto colex-container">
                <div class="flex items-center mb-6 pt-2">
                    <button onclick="ColeXApp.irAColeccion()" class="text-amber-custom hover:text-white text-2xl mr-4 cursor-pointer font-bold">←</button>
                    <h2 id="formTitle" class="text-xl font-bold text-amber-custom">Agregar Coleccionable</h2>
                </div>

                <form id="formObra" onsubmit="ColeXApp.guardarObra(event)" class="space-y-4 flex-1 flex flex-col justify-between pb-4">
                    <input type="hidden" id="editObraId" value="">

                    <div class="space-y-3.5">
                        <!-- Cuadro de Portada / Foto Dual con Compresión -->
                        <div class="flex flex-col p-4 colex-card rounded-2xl border-2 border-dashed border-gray-600 space-y-2.5">
                            <span class="text-xs font-bold text-amber-custom flex items-center justify-between">
                                <span>📷 Foto / Portada</span>
                                <span id="compressBadge" class="hidden text-[10px] text-green-400 font-normal">⚡ Imagen Comprimida</span>
                            </span>
                            <div>
                                <label for="portadaFile" class="flex items-center justify-center gap-2 w-full py-2.5 px-3 colex-card hover:bg-gray-700 rounded-xl text-xs font-semibold text-amber-custom cursor-pointer transition shadow-sm">
                                    📁 Elegir archivo local (jpg, png, webp)
                                </label>
                                <input type="file" id="portadaFile" onchange="ColeXApp.procesarArchivo(this)" accept=".jpg, .jpeg, .png, .webp" class="hidden">
                                <span id="fileName" class="block text-[11px] text-gray-400 mt-1 text-center truncate">Sin archivo seleccionado</span>
                            </div>
                            <div class="text-center text-[10px] text-gray-400 font-medium uppercase tracking-wider">- o pega la url de la imagen -</div>
                            <div>
                                <input type="url" id="portadaUrl" placeholder="pega la url de la imagen" class="w-full text-center text-xs p-2.5 colex-input rounded-lg placeholder-gray-500">
                            </div>
                        </div>

                        <div>
                            <label class="text-xs text-gray-400 font-semibold uppercase tracking-wider">Nombre / Título *</label>
                            <input type="text" id="titulo" required class="w-full p-3 colex-input rounded-xl text-sm" placeholder="Ej. The Dark Knight / Master of Puppets">
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label id="lblNumero" class="text-xs text-gray-400 font-semibold uppercase tracking-wider">Número / Set</label>
                                <input type="text" id="numero" class="w-full p-3 colex-input rounded-xl text-sm" placeholder="Ej. #1 o 025/102">
                            </div>
                            <div>
                                <label class="text-xs text-gray-400 font-semibold uppercase tracking-wider">Año</label>
                                <input type="number" id="anio" class="w-full p-3 colex-input rounded-xl text-sm" placeholder="Ej. 2023">
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="text-xs text-gray-400 font-semibold uppercase tracking-wider">Categoría *</label>
                                <select id="tipoMaterial" required onchange="ColeXApp.cambiarTipo(this.value)" class="w-full p-3 colex-input rounded-xl text-sm">
                                    <option value="" class="bg-gray-900">Seleccionar...</option>
                                    <option value="Cómic / Manga / Libro / Fanzine / Revista" class="bg-gray-900">Cómic / Manga / Libro / Fanzine / Revista</option>
                                    <option value="Cartas TCG" class="bg-gray-900">Cartas TCG</option>
                                    <option value="Vehículos a Escala (Hot Wheels)" class="bg-gray-900">Hot Wheels / Vehículos</option>
                                    <option value="Figuras / Funkos / Estatuas" class="bg-gray-900">Figuras / Funkos / Estatuas</option>
                                    <option value="Videojuegos / Retro" class="bg-gray-900">Videojuegos / Retro</option>
                                    <option value="Música (LPs/Vinilos, CDs)" class="bg-gray-900">Música (LPs/Vinilos, CDs)</option>
                                    <option value="Otro / Fanzine" class="bg-gray-900">Otro / Fanzine</option>
                                </select>
                            </div>
                            <div>
                                <label class="text-xs text-gray-400 font-semibold uppercase tracking-wider">Variante / Formato *</label>
                                <select id="subtipoMaterial" required class="w-full p-3 colex-input rounded-xl text-sm">
                                    <option value="" class="bg-gray-900">Selecciona categoría primero...</option>
                                </select>
                            </div>
                        </div>

                        <!-- CheckBox de Leído -->
                        <div id="leidoContainer" class="hidden flex items-center space-x-3 p-3 colex-card rounded-xl border border-amber-600/40">
                            <input type="checkbox" id="chkLeido" class="w-5 h-5 text-amber-600 bg-gray-900 border-gray-600 rounded focus:ring-amber-500 cursor-pointer">
                            <label for="chkLeido" class="text-xs font-semibold text-amber-custom cursor-pointer select-none flex-1">
                                📖 ¿Leído / Completado? <span class="block text-[10px] text-gray-400 font-normal">Marca si ya leíste esta obra o la tienes pendiente</span>
                            </label>
                        </div>

                        <!-- Calificación de Estrellas (1-5) -->
                        <div>
                            <label class="text-xs text-amber-custom font-semibold uppercase tracking-wider">Calificación Personal (★)</label>
                            <select id="estrellas" class="w-full p-3 colex-input rounded-xl text-sm">
                                <option value="0" class="bg-gray-900">Sin calificación</option>
                                <option value="1" class="bg-gray-900">★ 1 Estrella (Regular)</option>
                                <option value="2" class="bg-gray-900">★★ 2 Estrellas (Bueno)</option>
                                <option value="3" class="bg-gray-900">★★★ 3 Estrellas (Muy Bueno)</option>
                                <option value="4" class="bg-gray-900">★★★★ 4 Estrellas (Excelente)</option>
                                <option value="5" class="bg-gray-900">★★★★★ 5 Estrellas (Obra Maestra / Joya)</option>
                            </select>
                        </div>

                        <!-- Etiquetas / Tags Rápidas -->
                        <div>
                            <label class="text-xs text-gray-400 font-semibold uppercase tracking-wider">Etiquetas / Atributos Especiales</label>
                            <div class="grid grid-cols-2 gap-2 mt-1.5">
                                <label class="flex items-center space-x-2 p-2.5 colex-card rounded-xl text-xs cursor-pointer hover:bg-gray-700">
                                    <input type="checkbox" name="tagCheck" value="Edición Especial" class="w-4 h-4 text-amber-600 bg-gray-900 border-gray-600 rounded">
                                    <span>Edición Especial</span>
                                </label>
                                <label class="flex items-center space-x-2 p-2.5 colex-card rounded-xl text-xs cursor-pointer hover:bg-gray-700">
                                    <input type="checkbox" name="tagCheck" value="Firmado" class="w-4 h-4 text-amber-600 bg-gray-900 border-gray-600 rounded">
                                    <span>Firmado</span>
                                </label>
                                <label class="flex items-center space-x-2 p-2.5 colex-card rounded-xl text-xs cursor-pointer hover:bg-gray-700">
                                    <input type="checkbox" name="tagCheck" value="Con Protector" class="w-4 h-4 text-amber-600 bg-gray-900 border-gray-600 rounded">
                                    <span>Con Protector</span>
                                </label>
                                <label class="flex items-center space-x-2 p-2.5 colex-card rounded-xl text-xs cursor-pointer hover:bg-gray-700">
                                    <input type="checkbox" name="tagCheck" value="Sellado" class="w-4 h-4 text-amber-600 bg-gray-900 border-gray-600 rounded">
                                    <span>Sellado / Nuevo</span>
                                </label>
                            </div>
                        </div>

                        <div>
                            <label id="lblAutor" class="text-xs text-gray-400 font-semibold uppercase tracking-wider">Autor / Artista / Serie</label>
                            <input type="text" id="autor" class="w-full p-3 colex-input rounded-xl text-sm" placeholder="Ej. Stan Lee / Metallica / Konami">
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label id="lblEditorial" class="text-xs text-gray-400 font-semibold uppercase tracking-wider">Editorial / Fabricante</label>
                                <input type="text" id="editorial" class="w-full p-3 colex-input rounded-xl text-sm" placeholder="Ej. Marvel, Sony Music, Mattel">
                            </div>
                            <div>
                                <label class="text-xs text-gray-400 font-semibold uppercase tracking-wider">Estado</label>
                                <select id="estadoFisico" class="w-full p-3 colex-input rounded-xl text-sm">
                                    <option value="Nuevo / Mint" class="bg-gray-900">Nuevo / Mint</option>
                                    <option value="Excelente" class="bg-gray-900">Excelente</option>
                                    <option value="Usado / Jugado" class="bg-gray-900">Usado / Jugado</option>
                                    <option value="Deteriorado" class="bg-gray-900">Deteriorado</option>
                                </select>
                            </div>
                        </div>

                        <div>
                            <label class="text-xs text-amber-custom font-semibold uppercase tracking-wider">Precio Aproximado ($)</label>
                            <input type="number" step="0.01" id="valorManual" value="0.00" class="w-full p-3 colex-input rounded-xl text-sm">
                        </div>

                        <!-- Campo de Notas u Observaciones Personalizadas -->
                        <div>
                            <label class="text-xs text-gray-400 font-semibold uppercase tracking-wider">Notas / Observaciones</label>
                            <textarea id="notas" rows="2" class="w-full p-3 colex-input rounded-xl text-xs placeholder-gray-500" placeholder="Ej. Con estuche protector, edición firmada, detalles en esquina..."></textarea>
                        </div>
                    </div>

                    <button type="submit" id="btnSubmitForm" class="w-full py-3.5 bg-amber-btn text-white font-bold rounded-xl transition cursor-pointer mt-4 shadow-md">Guardar Ítem</button>
                </form>
            </section>

            <!-- ================= PANTALLA 4: FILTROS Y ESTADÍSTICAS ================= -->
            <section id="viewStats" class="app-screen hidden flex-1 flex flex-col p-5 overflow-y-auto colex-container">
                <div class="flex items-center mb-4 pt-2">
                    <button onclick="ColeXApp.irAColeccion()" class="text-amber-custom hover:text-white text-2xl mr-4 cursor-pointer font-bold">←</button>
                    <h2 class="text-xl font-bold text-amber-custom">Filtros & Estadísticas Avanzadas</h2>
                </div>

                <!-- Panel de Filtros Avanzados -->
                <div class="space-y-3.5 colex-card p-4 rounded-2xl mb-4">
                    <h3 class="font-bold text-xs text-amber-custom uppercase tracking-wider">Filtros de Búsqueda</h3>
                    
                    <div>
                        <label class="text-[11px] text-gray-400 font-semibold">Filtrar por Categoría</label>
                        <select id="filtroTipo" class="w-full p-2.5 colex-input rounded-xl text-xs mt-1">
                            <option value="" class="bg-gray-900">Todas las categorías</option>
                            <option value="Cómic / Manga / Libro / Fanzine / Revista" class="bg-gray-900">Cómic / Manga / Libro / Fanzine / Revista</option>
                            <option value="Cartas TCG" class="bg-gray-900">Cartas TCG</option>
                            <option value="Vehículos a Escala (Hot Wheels)" class="bg-gray-900">Hot Wheels / Vehículos</option>
                            <option value="Figuras / Funkos / Estatuas" class="bg-gray-900">Figuras / Funkos / Estatuas</option>
                            <option value="Videojuegos / Retro" class="bg-gray-900">Videojuegos / Retro</option>
                            <option value="Música (LPs/Vinilos, CDs)" class="bg-gray-900">Música (LPs/Vinilos, CDs)</option>
                            <option value="Otro / Fanzine" class="bg-gray-900">Otro / Fanzine</option>
                        </select>
                    </div>

                    <div>
                        <label class="text-[11px] text-gray-400 font-semibold">Filtrar por Editorial / Fabricante / Disquera</label>
                        <input type="text" id="filtroEditorial" placeholder="Ej. Marvel, Sony Music..." class="w-full p-2.5 colex-input rounded-xl text-xs placeholder-gray-500 mt-1">
                    </div>

                    <div>
                        <label class="text-[11px] text-gray-400 font-semibold">Precio Máximo ($)</label>
                        <input type="number" id="filtroPrecio" placeholder="Ej. 50" class="w-full p-2.5 colex-input rounded-xl text-xs placeholder-gray-500 mt-1">
                    </div>

                    <button onclick="ColeXApp.aplicarFiltros()" class="w-full py-2 bg-amber-btn text-white font-semibold rounded-xl text-xs transition cursor-pointer">Aplicar Filtros</button>
                    <button onclick="ColeXApp.limpiarFiltros()" class="w-full py-1.5 bg-transparent text-gray-400 font-medium rounded-xl text-xs hover:text-white transition cursor-pointer">Limpiar Filtros</button>
                </div>

                <!-- Panel de Métricas Avanzadas -->
                <div class="space-y-3 colex-card p-4 rounded-2xl mb-4">
                    <h3 class="font-bold text-xs text-amber-custom uppercase tracking-wider">Métricas Generales</h3>
                    <div class="flex justify-between text-sm">
                        <span class="text-gray-400">Ítems filtrados/totales:</span>
                        <span id="statTotal" class="font-bold text-gray-200">0</span>
                    </div>
                    <div class="flex justify-between text-sm">
                        <span class="text-gray-400">Valor total estimado:</span>
                        <span id="statValor" class="font-bold text-amber-custom">$0.00</span>
                    </div>
                    <div id="statDesgloseCategorias" class="pt-2 border-t border-gray-700 space-y-1 text-xs">
                        <!-- Desglose por categoría inyectado por JS -->
                    </div>
                </div>

                <!-- Botones de Exportación -->
                <div class="space-y-2.5 pt-2">
                    <h3 class="font-bold text-xs text-amber-custom uppercase tracking-wider">Exportar Datos</h3>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="ColeXApp.exportarCSV()" class="py-2.5 bg-green-700 text-white font-semibold rounded-xl text-xs hover:bg-green-600 transition cursor-pointer shadow-sm">CSV</button>
                        <button onclick="ColeXApp.exportarExcel()" class="py-2.5 bg-blue-700 text-white font-semibold rounded-xl text-xs hover:bg-blue-600 transition cursor-pointer shadow-sm">Excel</button>
                        <button onclick="ColeXApp.exportarPDF()" class="py-2.5 bg-red-700 text-white font-semibold rounded-xl text-xs hover:bg-red-600 transition cursor-pointer shadow-sm">PDF</button>
                    </div>
                </div>
            </section>

        </div>
    </div>

    <!-- Script Principal como Módulo -->
    <script type="module" src="app.js?v=18.0"></script>
</body>
</html>

    <!-- Script Principal como Módulo -->
    <script type="module" src="app.js?v=17.0"></script>
</body>
</html>
